tagline: Word／Excel／PDFなどを、ミリ秒単位でMarkdownにそろえるRust製変換ライブラリ
what: Firecrawl製の文書変換ライブラリ。Office系・OpenDocument・RTF・EPUB・CSV・PDFなどを統一的なGFM Markdownにする。Node／Python／WASM／CLIがあり、エージェントスキルとしても配布。スキャンPDFのOCRはFirecrawl
  Parseへ indirection。
goodFor:
- RAG前のオフィス文書正規化
- エージェントに渡す文書の前処理
ease:
  level: 5
  text: npx や pip で即実行できる。
  install: npx @firecrawl/anydoc --help
