slug: rea
name: REA
repo: morluto/rea
homepage: https://rea.tools
category: dev
uses:
- coding
- agent
tagline: アプリやバイナリの仕組みを、ソースがなくてもエージェントに調べさせるリバースエンジニアリングMCP
what: ソースコードがないアプリやネイティブバイナリの挙動を、エージェントから調べるためのMCPツール一式。JavaScript／Electron、.NET、Webサイトの静的解析に加え、Hopper・Ghidra・IDAなどと連携してネイティブ解析もできる。気になる機能の作り方を証拠つきで説明させ、自分のプロジェクト向けに再実装する流れを想定している。
goodFor:
- 競合アプリの機能の仕組みを調査する
- バイナリやElectronアプリの挙動解析
- エージェントにリバース作業を任せる
ease:
  level: 3
  text: npx でセットアップでき、対応するエージェントに登録する。ネイティブ解析はHopper／Ghidra／IDAのいずれかがあると本領を発揮する。
  install: npx rea-agents setup
