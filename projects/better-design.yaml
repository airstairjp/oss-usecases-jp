- agent
tagline: AIコーディングエージェントに、デザインシステムとUIレビュー観点を渡すオープンなMCPサーバー
what: >-
  Claude Code、Cursor、GitHub CopilotなどMCP対応のコーディング環境向けに、配色・トークン・コンポーネント・使いやすさの確認項目を渡すデザインMCP。
  LinearやStripe、Vercelなど有名プロダクト風のデザインシステムを複数用意し、エージェントが画面を作るときに「どの作法で作るか」と「出来栄えの自己点検」を揃えられる。
  shadcn/ui向けのレジストリとしても使える。
goodFor:
- Claude CodeやCursorにUIを作らせるとき、無難で平凡な見た目を避けたいとき
- 既存の有名プロダクトに近いトーンで、プロトタイプの見た目を揃えたいとき
- 生成した画面を、コントラストやフォーカスなど最低限の観点でエージェントに見直させたいとき
ease:
  level: 3
  text: MCPクライアントにサーバーを登録し、デザインシステムを選んでから画面作成を依頼する。Claude Code／Cursor向けの手順がドキュメントにある。
