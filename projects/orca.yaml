tagline: Claude CodeやCodexなど複数のコーディングエージェントを、並べて同時に走らせて管理するアプリ
what: >-
  Codex、Claude Code、OpenCodeなどのコーディングエージェントを、それぞれ別のgit worktree（作業用に分けたディレクトリ）で同時に動かし、1つの画面で進み具合を追えるアプリ。1つの指示を複数のエージェントに配って結果を比べ、良いものを採用する使い方ができる。各エージェントは自分の契約プランのまま使え、スマホアプリから完了通知を受けたり追加の指示を送ったりもできる。
goodFor:
- 同じ課題を複数のエージェントに解かせて、出来の良い案を選びたいとき
- 複数の作業を並行で進め、エージェントの状況を1か所で見たいとき
- 外出中もスマホからエージェントの進み具合を確認したいとき
