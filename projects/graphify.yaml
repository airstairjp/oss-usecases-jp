slug: graphify
name: Graphify
repo: Graphify-Labs/graphify
homepage: https://www.graphify.com
category: dev
uses:
- coding
- rag
tagline: コードや文書を知識グラフ化し、grepではなく関係をたどって質問できるツール
what: コーディングエージェントから /graphify と指示すると、コード・文書・PDFなどを知識グラフに変換する。コードはtree-sitterでローカル解析（LLM不要）、文書などは意味解析を併用。ベクトル検索ではなくグラフをたどる方式で、エージェントのトークン消費を抑えやすいと謳っている。
goodFor:
- 大きなリポジトリの構造把握
- エージェントにコードベースを効率よく読ませたいとき
ease:
  level: 4
  text: 対応エージェントにスキルとして入れる。クラウド版（有料）もある。
