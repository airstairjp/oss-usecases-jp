tagline: ブランドに合わせた図解を、1つのHTML＋SVGとしてエージェントに描かせるスキル
what: アーキテクチャ図・四象限・シーケンスなど約45種の図を、影やMermaidっぽさを避けた編集向けスタイルで、単一のHTMLファイルとして出力するエージェントスキル。サイトURLから色やフォントを取り込み、以降の図をブランドに揃えられる。
goodFor:
- 資料用のきれいな図解を量産する
- エージェントにブランド準拠のダイアグラムを描かせる
ease:
  level: 5
  text: npx skills add で導入し、自然言語で図の種類を指定する。
  install: npx skills add cathrynlavery/diagram-design
