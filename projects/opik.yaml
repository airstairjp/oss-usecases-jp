slug: opik
name: Opik
repo: comet-ml/opik
homepage: https://www.comet.com/docs/opik/
category: dev
uses: [eval, agent]
tagline: LLMアプリやエージェントの動きを記録し、品質を評価・監視するための基盤
what: >-
  Comet社が公開している、LLMアプリ・RAG・エージェント向けの観測と評価のツール。各実行の入出力や途中のツール呼び出しを
  トレースとして記録し、テスト用データセットに対する自動評価（LLMに採点させる方式を含む）、プロンプトやモデルの比較、
  本番環境のダッシュボード監視までを1つの画面で扱える。
goodFor:
  - プロンプトやモデルを変えたときの品質の比較
  - エージェントが失敗した原因の調査（どのステップで何が起きたか）
  - 本番のLLMアプリの品質劣化の監視
cases:
  - title: EC支援のPatternが、評価にもとづいて安いモデルへの切り替えを判断
    summary: >-
      Opikでモデルとプロンプトを同じデータセットで比較し、品質が同等でより安いモデルを選定。公式事例では年約6万ドルの削減見込みとしている。
    source: {name: Comet公式 導入事例（英語）, url: "https://www.comet.com/site/customers/pattern-ai-content-analysis/"}
  - title: AIコーディングのZencoderが、エージェントの挙動のデバッグに利用
    summary: >-
      コーディングエージェントの実行をトレースと注釈で確認し、不具合の原因調査やリグレッション（性能の後退）の検出、チーム間の共有に使っていると紹介されている。
    source: {name: Comet公式 導入事例（英語）, url: "https://www.comet.com/site/customers/zencoder-ai-code-generator/"}
ease:
  level: 3
  text: SDKは pip で入る。セルフホストはリポジトリのスクリプトかDocker Composeで起動し、クラウド版も選べる。評価の設計には慣れが必要。
  install: pip install opik
