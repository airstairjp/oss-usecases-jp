slug: public-apis
name: Public APIs
repo: public-apis/public-apis
homepage: https://github.com/public-apis/public-apis
category: dev
uses: [api, agent]
tagline: 無料で使える公開APIを、認証方式・HTTPS・CORSの情報つきでカテゴリ別に並べた一覧
what: >-
  天気、金融、地図、翻訳、画像、政府データなど、無料で使える公開APIをカテゴリ別に集めたリスト。各APIに、
  認証方式（不要・APIキー・OAuth）、HTTPS対応の有無、ブラウザから直接呼べるか（CORS）が書かれている。
  ソフトウェアではなくリスト（データ）のリポジトリで、試作のネタ探しやAIエージェントに持たせるツール探しの起点として使われる。
goodFor:
  - ハッカソンや試作で使えるAPIを探す
  - AIエージェントに持たせる外部ツール（API）の候補探し
  - 認証不要ですぐ叩けるAPIの洗い出し
