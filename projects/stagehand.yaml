slug: stagehand
name: Stagehand
repo: browserbase/stagehand
homepage: https://stagehand.dev
category: web-data
uses:
- browser
- scraping
- automation
tagline: コードと自然言語の指示を混ぜて書けるブラウザ自動化SDK
what: Browserbase社が公開しているブラウザ自動化のSDK（TypeScript中心）。決まった手順は通常のコードで書き、 画面構成が変わりやすい部分だけを act（操作）・extract（抽出）・observe（候補を見つける）といった自然言語の指示でAIに任せられる。
  全部をAI任せにするより動きが読みやすく、繰り返し実行するときのLLM呼び出しも抑えやすい。
goodFor:
- 行政・取引先ポータルなど、APIのないサイトへの定型入力
- レイアウトがよく変わるサイトからのデータ抽出
- 既存のPlaywrightスクリプトの保守を減らしたい場合
cases:
- title: 税務SaaSのNumeralが、48州の売上税ポータル操作を自動化
  summary: 米国各州の売上税申告ポータルの操作をBrowserbaseとStagehandで自動化。州ごとにPlaywrightのスクリプトを書く手間と、ページ変更のたびに直す保守を減らしたと紹介されている。
  source:
    name: Browserbase公式ブログ（英語）
    url: https://www.browserbase.com/website/blog/numeral-automates-sales-tax
ease:
  level: 4
  text: npm で入れて、ローカルのChromeでもBrowserbaseのクラウドブラウザでも動く。LLMのAPIキーが必要。
  install: npx create-browser-app
