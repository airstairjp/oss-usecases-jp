tagline: 思い出すだけでなく、経験から学ぶことに焦点を当てたエージェント記憶システム
what: 会話履歴の再現だけでなく、エージェントが時間をかけて学習・更新していくためのメモリ基盤。LongMemEvalなどで高い精度を報告し、LLMラッパー、MCP、各種コーディングエージェントへの組み込み方を用意している。
goodFor:
- 長期運用するエージェントの記憶層
- 単なるRAGでは足りない継続学習が必要なとき
