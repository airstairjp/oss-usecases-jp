slug: motion-primitives
name: Motion Primitives
repo: ibelick/motion-primitives
homepage: https://motion-primitives.com
category: content
uses:
- writing
- coding
tagline: 文字やボタンに、なめらかな動きを足せるReact向けのモーション部品集
what: >-
  Motion（旧Framer Motion）とTailwind CSSを前提に、ふわっと現れる文字・スライドするパネル・ホバー演出など、よく使うUIアニメーションを部品として揃えたライブラリ。
  ドキュメントサイトからコピーして組み込める形で配布されており、コーディングエージェントに「この演出を当てて」と指示するときの共通語彙にもなりやすい。
goodFor:
- LPやダッシュボードの見出し・ボタンに、手書きせずに動きを足したいとき
- Claude CodeやCodexにUIを作らせるとき、動きの指定を部品名で揃えたいとき
- React／Next.jsの画面に、軽いマイクロインタラクションを足したいとき
ease:
  level: 4
  text: npmで入れ、ドキュメントの部品をコピーしてTailwindクラスと組み合わせる。ReactとMotionの知識があると速い。
  install: npm i motion motion-primitives
