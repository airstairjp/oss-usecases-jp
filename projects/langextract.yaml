tagline: 非構造テキストから、根拠位置つきで構造化情報を抜き出すGoogle製ライブラリ
what: ユーザーが定義した指示とFew-shot例に沿い、LLMでテキストから構造化データを抽出する。抽出結果を原文位置に紐づけ、長文向けの分割・並列・可視化HTMLも備える。クラウドモデル뿐아니라
  OllamaなどローカルLLMにも対応。
goodFor:
- 契約書・診療記録・報告書からの項目抽出
- 抽出結果の根拠を画面で確認したいとき
ease:
  level: 4
  text: pip で入れ、モデルAPIキーまたはOllamaを用意すれば始められる。
  install: pip install langextract
